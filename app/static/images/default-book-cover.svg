<svg width="200" height="300" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Book spine -->
  <rect x="0" y="0" width="200" height="300" fill="url(#bookGradient)" rx="8" ry="8"/>

  <!-- Book pages -->
  <rect x="15" y="15" width="170" height="270" fill="#F8F8F8" rx="4" ry="4"/>
  <rect x="25" y="25" width="150" height="250" fill="#FFFFFF" rx="2" ry="2"/>

  <!-- Book title area -->
  <rect x="35" y="45" width="130" height="8" fill="#333" rx="1"/>
  <rect x="35" y="60" width="100" height="6" fill="#666" rx="1"/>
  <rect x="35" y="75" width="120" height="6" fill="#666" rx="1"/>
  <rect x="35" y="90" width="80" height="6" fill="#666" rx="1"/>

  <!-- Book icon -->
  <g transform="translate(75, 140)">
    <rect x="0" y="0" width="50" height="60" fill="#4A90E2" rx="3"/>
    <rect x="8" y="8" width="34" height="44" fill="#FFFFFF"/>
    <rect x="12" y="12" width="26" height="4" fill="#333"/>
    <rect x="12" y="20" width="20" height="3" fill="#666"/>
    <rect x="12" y="26" width="24" height="3" fill="#666"/>
    <rect x="12" y="32" width="18" height="3" fill="#666"/>
  </g>

  <!-- Shadow effect -->
  <rect x="5" y="5" width="190" height="290" fill="none" stroke="#000" stroke-width="1" opacity="0.1" rx="8"/>
</svg>