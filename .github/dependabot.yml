version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule: { interval: "weekly" }
    groups:
      docker-deps: { patterns: ["*"], update-types: ["patch", "minor", "major"] }
    cooldown: { default-days: 3 }

  - package-ecosystem: "pip"
    directory: "/"
    schedule: { interval: "weekly" }
    groups:
      pip-deps: { patterns: ["*"], update-types: ["patch", "minor", "major"] }
    cooldown: { default-days: 3, semver-major-days: 14 }

  - package-ecosystem: "terraform"
    directory: "/terraform/bootstrap-state-s3"
    schedule: { interval: "weekly" }
    groups:
      terraform-deps: { patterns: ["*"], update-types: ["patch", "minor", "major"] }
    cooldown: { default-days: 3 }

  - package-ecosystem: "terraform"
    directory: "/terraform/main"
    schedule: { interval: "weekly" }
    groups:
      terraform-deps: { patterns: ["*"], update-types: ["patch", "minor", "major"] }
    cooldown: { default-days: 3 }

  - package-ecosystem: "terraform"
    directory: "/terraform/main/envs/services"
    schedule: { interval: "weekly" }
    groups:
      terraform-deps: { patterns: ["*"], update-types: ["patch", "minor", "major"] }
    cooldown: { default-days: 3 }

  - package-ecosystem: "terraform"
    directory: "/terraform/main/modules/cloudfront"
    schedule: { interval: "weekly" }
    groups:
      terraform-deps: { patterns: ["*"], update-types: ["patch", "minor", "major"] }
    cooldown: { default-days: 3 }

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    groups:
      actions-deps: { patterns: ["*"], update-types: ["patch", "minor", "major"] }
    cooldown: { default-days: 3 }
