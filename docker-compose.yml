services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tkc_library
    ports:
      - "5521:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tkc_library"]
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-compatible object store for local dev. The app talks to it by setting
  # S3_ENDPOINT_URL=http://localhost:9000 — boto3 routes to MinIO with the
  # same SDK calls it uses against AWS in prod.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # MinIO web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot bucket bootstrap. Creates the dev bucket and sets a public-read
  # policy so the browser can GET uploaded images without any auth — same
  # behaviour as the prod Terraform setup, just locally.
  minio-bootstrap:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      BUCKET: tkc-librarian-uploads-services
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/$$BUCKET &&
      mc anonymous set download local/$$BUCKET &&
      echo 'MinIO bucket ready: '$$BUCKET
      "

volumes:
  postgres_data:
  minio_data:
