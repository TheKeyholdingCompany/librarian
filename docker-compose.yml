services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tkc_library
    ports:
      - "5521:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tkc_library"]
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-compatible object store for local dev. The app talks to it by setting
  # S3_ENDPOINT_URL=http://localhost:9000 — boto3 routes to RustFS with the
  # same SDK calls it uses against AWS in prod.
  # Console (for browsing objects): http://localhost:9001/rustfs/console/
  #
  # Replaced MinIO in October 2026 (TKC-0863), following the repos that moved
  # under COR-0570: Docker Hub dropped `minio/*` (TKC-0540) and the quay.io
  # mirror others were repointed at now refuses anonymous pulls too.
  #
  # There is no bucket-bootstrap sidecar. RustFS creates no bucket and, unlike
  # MinIO, sends no CORS headers until a bucket carries a rule, so the bucket,
  # its public-read policy and its CORS rule are applied together by
  # `python scripts/ensure_uploads_bucket.py` (see README).
  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_VOLUMES: /data
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # RustFS web console
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  # # Local Keycloak for OIDC. Realm import file lives in the keycloak-config
  # # repo and gets dropped into ./keycloak-import/ before `docker compose up`
  # # (see README). Dev-mode start so HTTPS isn't required on localhost.
  # keycloak:
  #   image: quay.io/keycloak/keycloak:25.0
  #   restart: unless-stopped
  #   command: start-dev --import-realm
  #   environment:
  #     KEYCLOAK_ADMIN: admin
  #     KEYCLOAK_ADMIN_PASSWORD: admin
  #     KC_HOSTNAME_STRICT: "false"
  #     KC_HTTP_ENABLED: "true"
  #   ports:
  #     - "8081:8080"
  #   volumes:
  #     - ./keycloak-import:/opt/keycloak/data/import:ro
  #     - keycloak_data:/opt/keycloak/data

volumes:
  postgres_data:
  rustfs_data:
  # keycloak_data:
